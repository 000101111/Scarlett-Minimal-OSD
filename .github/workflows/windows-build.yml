name: Windows build (manual preview)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'bridge/**'
      - 'build.ps1'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build portable preview
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Scarlett-Minimal-OSD-Windows-preview
          path: dist/ScarlettMonitorOSD/
          if-no-files-found: error
